spring.application.name=notification-service

# Configuracoes do banco de dados - usando o banco criado pelo init.sql (notificationservice_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/notificationservice_db
spring.datasource.username=notificationservice
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
# Desabilita Flyway temporariamente (workaround)
#spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=5
logging.level.org.flywaydb=DEBUG
logging.level.org.flywaydb.core=DEBUG
# spring.flyway.validate-on-migrate=true  # Habilitar as migrations cobrirem todo o schema

# Configuracoes de logging
logging.level.com.fiap=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# /api-docs endpoint custom path
springdoc.api-docs.path=/api-doc

# URL do servico de notification (integração) - variável para facilitar ambiente docker/compose
notification.service.url=${USER_SERVICE_URL:http://localhost:8083}

# JWT
jwt.secret=${JWT_SECRET:dev-secret-change-me}
jwt.expiration-ms=3600000

# usuário simples para testes (somente para dev)
spring.security.notification.name=fiap
spring.security.notification.password=fiap2025

# Spring Boot
spring.main.allow-bean-definition-overriding=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# consumer espera String JSON:
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# caso o consumer use JsonDeserializer para mapear pra DTO:
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*