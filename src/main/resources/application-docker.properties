spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
logging.level.org.springdoc=DEBUG
spring.jpa.show-sql=false

# (opcional) evita logs muito verbosos durante os testes
logging.level.org.hibernate=ERROR

# Conectar ao serviço Postgres do Docker Compose (nome do serviço: postgres)
spring.datasource.url=jdbc:postgresql://postgres:5432/notificationservice_db
spring.datasource.username=notificationservice
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging/config extras (opcional)
logging.level.org.hibernate.SQL=DEBUG

