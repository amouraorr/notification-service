## Ativação condicional deste arquivo quando o profile 'docker' estiver ativo
spring.config.activate.on-profile=docker

# Nome da aplicação
spring.application.name=notification-service

# Datasource - quando rodando via docker-compose o serviço Postgres costuma se chamar 'postgres'
spring.datasource.url=jdbc:postgresql://postgres:5432/notificationservice_db
spring.datasource.username=notificationservice
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
#spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# URL do servico de usuário / integrações
notification.service.url=http://localhost:8083

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
spring.main.allow-bean-definition-overriding=true

# JWT
jwt.secret=${JWT_SECRET:dev-secret-change-me}
jwt.expiration-ms=3600000

# usuário simples para testes
spring.security.notification.name=fiap
spring.security.notification.password=fiap2025

# logs Flyway para DEBUG para facilitar o diagnóstico (se reativar Flyway)
logging.level.com.fiap=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.flywaydb.core=DEBUG
logging.level.org.flywaydb=DEBUG

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# consumer espera String JSON:
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# caso o consumer use JsonDeserializer para mapear pra DTO:
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# /api-docs endpoint custom path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true